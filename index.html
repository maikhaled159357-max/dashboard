<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EF">
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://tjijgrysaeljfzwkgbpa.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #FAF6EF;
      --surface: #FFFFFF;
      --surface-2: #FBF7EF;
      --ink: #2A2118;
      --ink-2: #5C4E3D;
      --muted: #8A7B68;
      --border: #EEE5D5;
      --gold: #E7BC5C;
      --gold-deep: #C9983F;
      --orange: #DB8A4A;
      --gold-soft: #FBF1DC;
      --orange-soft: #F9E8D8;
      --income: #2F7D4F;
      --income-soft: #E3F2E8;
      --expense: #A8443A;
      --expense-soft: #F8E6E3;
      --info: #3A62B0;
      --info-soft: #E4ECF8;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(42,33,24,.05);
      --shadow-md: 0 8px 24px rgba(42,33,24,.07);
      --shadow-fab: 0 10px 26px rgba(201,152,63,.30);
      --ring: 0 0 0 3px rgba(231,188,92,.30);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      font-family: "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { text-wrap: balance; }

    .skip-link {
      position: absolute; top: -40px; inset-inline-start: 12px; z-index: 30;
      background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 10px;
      border: 1px solid var(--border); text-decoration: none; font-weight: 700;
    }
    .skip-link:focus { top: 12px; }

    button, input, select { font: inherit; }
    button {
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: background .2s, color .2s, transform .15s, box-shadow .2s;
    }
    button:active { transform: scale(.98); }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: none; box-shadow: var(--ring);
    }

    /* ===== Buttons ===== */
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--orange));
      color: var(--ink);
      border: none; border-radius: var(--radius-md);
      padding: 10px 20px; font-weight: 700; font-size: 15px;
      box-shadow: 0 4px 12px rgba(201,152,63,.20);
    }
    .btn-primary:hover { box-shadow: 0 6px 16px rgba(201,152,63,.28); }
    .btn-ghost {
      background: var(--surface); color: var(--ink-2);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 8px 16px; font-weight: 600; font-size: 14px;
    }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-icon {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); width: 34px; height: 34px;
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2);
    }
    .btn-icon:hover { background: var(--gold-soft); color: var(--ink); }
    .btn-icon.danger:hover { background: var(--expense-soft); color: var(--expense); }
    .btn-icon svg { width: 16px; height: 16px; }

    /* ===== Login ===== */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background:
        radial-gradient(circle at 15% 20%, rgba(231,188,92,.30), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(219,138,74,.25), transparent 45%),
        linear-gradient(160deg, #FBF3E2, #F8E9DA);
    }
    .login-card {
      background: var(--surface); width: 100%; max-width: 400px;
      padding: 34px 28px; border-radius: 24px; box-shadow: var(--shadow-md);
      border: 1px solid rgba(255,255,255,.7);
    }
    .login-mark {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: var(--ink);
    }
    .login-card h1 { margin: 0 0 4px; font-size: 24px; font-weight: 800; text-align: center; }
    .login-card .sub { margin: 0 0 22px; color: var(--muted); text-align: center; font-size: 14px; }
    .login-card .btn-primary { width: 100%; margin-top: 18px; padding: 12px; }
    .login-error { color: var(--expense); text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
    .lang-row { display: flex; justify-content: center; margin-bottom: 8px; }

    /* ===== Forms ===== */
    label { display: block; margin-top: 14px; font-size: 14px; color: var(--ink-2); font-weight: 600; }
    input, select {
      width: 100%; margin-top: 6px; padding: 11px 14px;
      background: var(--surface); color: var(--ink);
      border: 1.5px solid var(--border); border-radius: var(--radius-md);
      font-size: 15px;
    }
    input:focus, select:focus { border-color: var(--gold-deep); }

    /* ===== Top bar ===== */
    .topbar {
      background: #2A2118; color: #FBF3E2;
      padding: calc(16px + env(safe-area-inset-top, 0px)) 24px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 6;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 18px; margin: 0;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink); font-size: 15px; font-weight: 800;
    }
    .top-actions { display: flex; gap: 8px; }
    .top-actions .btn-ghost { background: rgba(255,255,255,.08); color: #FBF3E2; border-color: rgba(255,255,255,.15); }
    .top-actions .btn-ghost:hover { background: rgba(255,255,255,.16); }

    /* ===== Tabs ===== */
    .tabs {
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
      position: sticky; top: 64px; z-index: 5;
    }
    .tab {
      border: none; background: transparent; color: var(--muted);
      padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap;
    }
    .tab:hover { background: var(--surface-2); color: var(--ink); }
    .tab.active { background: linear-gradient(135deg, var(--gold), var(--orange)); color: var(--ink); box-shadow: 0 4px 10px rgba(201,152,63,.18); }

    /* ===== Layout ===== */
    main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 120px; }
    .view-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .view-head h2 { margin: 0; font-size: 22px; font-weight: 800; }
    .section-title { margin: 0 0 12px; font-size: 16px; font-weight: 700; color: var(--ink-2); }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin-top: 20px; }
    .card {
      background: var(--surface); border-radius: var(--radius-lg); padding: 22px;
      border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    }
    .card h3 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }

    /* ===== Stats ===== */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
    .stat {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px; text-align: center;
    }
    .stat .num { font-size: 22px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
    .stat .lbl { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 600; }
    .stat.income { background: var(--income-soft); border-color: transparent; }
    .stat.income .num { color: var(--income); }
    .stat.expense { background: var(--expense-soft); border-color: transparent; }
    .stat.expense .num { color: var(--expense); }
    .stat.net { background: var(--gold-soft); border-color: transparent; }

    /* ===== Lists ===== */
    .list { list-style: none; padding: 0; margin: 0; }
    .list li {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 4px; border-bottom: 1px solid var(--border);
    }
    .list li:last-child { border-bottom: none; }
    .list-main { min-width: 0; }
    .row-title { font-weight: 700; overflow-wrap: anywhere; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
    .row-side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .amount { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .amount.income { color: var(--income); }
    .amount.expense { color: var(--expense); }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; margin: 0; }

    .badge { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; white-space: nowrap; display: inline-block; }
    .done  { background: var(--income-soft); color: #2A6B45; }
    .doing { background: var(--info-soft); color: #33559A; }
    .todo  { background: #F2EFE9; color: var(--ink-2); }
    .alert { background: var(--expense-soft); color: #8A3A31; }
    .warn  { background: var(--gold-soft); color: #7A5A1E; }

    .chart-box { position: relative; height: 260px; }

    /* ===== Nono: floating button (bottom-left) + panel ===== */
    .nono-fab {
      position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 15;
      width: 60px; height: 60px; border-radius: 50%; border: none;
      background: linear-gradient(135deg, var(--gold), var(--orange));
      box-shadow: var(--shadow-fab);
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
    }
    .nono-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(201,152,63,.36); }
    .nono-fab svg { width: 26px; height: 26px; }
    .nono-fab.open { background: var(--ink); color: #FBF3E2; }

    .nono-panel {
      position: fixed; left: 20px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 15;
      width: min(380px, calc(100vw - 40px)); height: min(520px, calc(100vh - 140px));
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      display: flex; flex-direction: column; overflow: hidden;
      overscroll-behavior: contain;
    }
    .nono-head {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, var(--gold-soft), var(--orange-soft));
    }
    .nono-head .title { font-weight: 800; font-size: 16px; }
    .nono-close {
      background: rgba(255,255,255,.75); border: none; border-radius: 10px; width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); font-size: 18px; line-height: 1;
    }
    .nono-close:hover { background: #fff; }

    .chat-log {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bubble {
      max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; white-space: pre-wrap; word-break: break-word;
    }
    .bubble.you { align-self: flex-end; background: linear-gradient(135deg, var(--gold), var(--orange)); color: var(--ink); border-bottom-inline-end-radius: 6px; }
    .bubble.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-inline-start-radius: 6px; }
    .bubble.pending { opacity: .6; }
    .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
    .chat-form input { margin-top: 0; }
    .chat-form .btn-primary { flex-shrink: 0; }

    /* ===== Modal ===== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(42,33,24,.40); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20;
    }
    .modal {
      background: var(--surface); border-radius: var(--radius-lg); padding: 26px;
      width: 100%; max-width: 440px; box-shadow: var(--shadow-md);
      max-height: calc(100vh - 40px); overflow-y: auto; overscroll-behavior: contain;
    }
    .modal h3 { margin: 0 0 4px; font-size: 19px; font-weight: 800; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    @media (max-width: 640px) {
      .topbar { padding-inline: 16px; }
      .tabs { top: 62px; }
      main { padding: 18px 14px 120px; }
      .card { padding: 18px; }
      .nono-panel { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

  <!-- ===== Login ===== -->
  <div id="loginPage" class="login-wrap">

      <div class="lang-row">
        <button type="button" class="btn-ghost lang-toggle" data-action="toggleLang"></button>

      </label>
      <label><span data-i18n="password"></span>
        <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit" class="btn-primary" data-i18n="login"></button>

      </div>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-tab="dashboard" data-i18n="tabDashboard"></button>
      <button class="tab" data-tab="tasks" data-i18n="tabTasks"></button>
      <button class="tab" data-tab="transactions" data-i18n="tabTransactions"></button>
      <button class="tab" data-tab="projects" data-i18n="tabProjects"></button>

    <main id="main">

      <section id="view-projects" class="view" hidden></section>

    <!-- Nono floating button + panel -->
    <button class="nono-fab" id="nonoFab" aria-controls="nonoPanel" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12Z"/></svg>

    <div class="nono-panel" id="nonoPanel" role="dialog" aria-labelledby="chatTitle" hidden>

        <input id="chatInput" name="message" autocomplete="off" spellcheck="false">
        <button class="btn-primary" type="submit" id="chatSendBtn"></button>
      </form>
    </div>

    <!-- Add / Edit modal -->
    <div class="modal-backdrop" id="modal" hidden>
      <form class="modal" id="modalForm" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle"></h3>
        <div id="modalFields"></div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" data-action="closeModal" data-i18n="cancel"></button>
          <button type="submit" class="btn-primary" data-i18n="save"></button>
        </div>
      </form>

  </div>

    const TABS = ["dashboard", "tasks", "transactions", "projects"];
    const TAB_KEY = { dashboard: "tabDashboard", tasks: "tabTasks", transactions: "tabTransactions", projects: "tabProjects" };

    // ===== Table schemas: edit these to change fields =====
    const SCHEMAS = {
      tasks: {
        table: "tasks",
        fields: [
          { name: "title", type: "text", required: true },
          { name: "status", type: "select", options: ["todo", "doing", "done"], optionKey: "status_" },
          { name: "due_date", type: "date" },
        ],
      },
      transactions: {
        table: "transactions",
        fields: [
          { name: "date", type: "date", required: true },
          { name: "type", type: "select", options: ["income", "expense"], optionKey: "type_" },
          { name: "category", type: "text", required: true },
          { name: "amount", type: "number", required: true },
        ],
      },
      projects: {
        table: "projects",
        fields: [
          { name: "name", type: "text", required: true },
          { name: "client", type: "text" },
          { name: "status", type: "select", options: ["todo", "doing", "done"], optionKey: "status_" },
          { name: "amount", type: "number" },
          { name: "due_date", type: "date" },
        ],
      },
    };

    // ===== State =====
    let lang = "ar";
    let user = null;
    let editing = null;
    let currentTab = "dashboard";
    let chart = null;
    const cache = { tasks: [], transactions: [], projects: [] };
    // Messages: { who: "you", text } or { who: "bot", key } for translated text, or { who: "bot", text }
    const chatMessages = [{ who: "bot", key: "chatGreeting" }];

    // ===== Helpers =====
    function t(key, vars = {}) {
      let s = T[lang][key] ?? T.en[key] ?? key;
      for (const k in vars) s = s.replace(`{${k}}`, vars[k]);
      return s;
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    function money(n) {
      const fmt = new Intl.NumberFormat(lang === "ar" ? "ar-EG" : "en-US");
      return fmt.format(Number(n || 0)) + " " + t("currency");
    }

    function sumBy(arr) {
      return arr.reduce((s, x) => s + Number(x.amount || 0), 0);
    }

    function parseDate(s) {
      const [y, m, d] = String(s).split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function daysUntil(s) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((parseDate(s) - today) / 86400000);
    }

    function statusBadge(s) {
      const v = s || "todo";
      return `<span class="badge ${v}">${t("status_" + v)}</span>`;
    }

    function applyI18n() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
      document.querySelectorAll(".lang-toggle").forEach(b => b.textContent = lang === "ar" ? "English" : "عربي");
      document.getElementById("chatSendBtn").textContent = t("chatSend");
      document.getElementById("chatInput").placeholder = t("chatPlaceholder");
      document.getElementById("chatInputLabel").textContent = t("chatPlaceholder");
      document.getElementById("chatTitle").textContent = t("nonoTitle");
      document.getElementById("nonoFab").setAttribute("aria-label", t("nonoOpen"));
      document.getElementById("nonoClose").setAttribute("aria-label", t("close"));
    }

    // ===== Data =====
    async function loadTable(name) {
      const { data, error } = await sb.from(SCHEMAS[name].table)
        .select("*").order("created_at", { ascending: false });
      if (error) { alert(error.message); return; }
      cache[name] = data || [];
    }

    async function loadAll() {
      await Promise.all(Object.keys(SCHEMAS).map(loadTable));
    }

    async function refreshAll() {
      await loadAll();
      renderAll();
    }

    // ===== Views =====
    function renderAll() {
      renderDashboard();
      renderList("tasks");
      renderList("transactions");
      renderList("projects");
      renderChat();
      showTab(currentTab);
    }

    function showTab(name) {
      if (!TABS.includes(name)) name = "dashboard";
      currentTab = name;
      document.querySelectorAll(".tab").forEach(b => {
        const active = b.dataset.tab === name;
        b.classList.toggle("active", active);
        b.setAttribute("aria-current", active ? "page" : "false");
      });
      document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== "view-" + name);
      // Reflect the active tab in the URL hash so it survives a refresh
      if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
    }

    function renderDashboard() {
      const el = document.getElementById("view-dashboard");
      const now = new Date();
      const monthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

      const monthTx = cache.transactions.filter(x => String(x.date).startsWith(monthKey));
      const income = sumBy(monthTx.filter(x => x.type === "income"));
      const expense = sumBy(monthTx.filter(x => x.type === "expense"));
      const subs = sumBy(monthTx.filter(x => x.type === "expense" && /اشتراك|subscri/i.test(x.category || "")));

      const alerts = cache.tasks
        .filter(x => x.status !== "done" && x.due_date && daysUntil(x.due_date) <= 2)
        .map(x => {
          const d = daysUntil(x.due_date);
          const msg = d < 0 ? t("overdue", { n: Math.abs(d) }) : d === 0 ? t("dueToday") : t("daysLeft", { n: d });
          return `<li><span class="row-title">${esc(x.title)}</span><span class="badge ${d < 0 ? "alert" : "warn"}">${msg}</span></li>`;
        });

      const byMonth = {};
      cache.transactions.filter(x => x.type === "expense").forEach(x => {
        const m = String(x.date).slice(0, 7);
        byMonth[m] = (byMonth[m] || 0) + Number(x.amount);
      });
      const labels = Object.keys(byMonth).sort();
      const values = labels.map(l => byMonth[l]);

      el.innerHTML = `
        <div class="view-head"><h2>${t("thisMonth")}</h2></div>
        <div class="card">
          <div class="stats">
            <div class="stat income"><div class="num">${money(income)}</div><div class="lbl">${t("income")}</div></div>
            <div class="stat expense"><div class="num">${money(expense)}</div><div class="lbl">${t("expenses")}</div></div>
            <div class="stat net"><div class="num">${money(income - expense)}</div><div class="lbl">${t("net")}</div></div>
            <div class="stat"><div class="num">${money(subs)}</div><div class="lbl">${t("subscriptions")}</div></div>
          </div>
        </div>
        <div class="grid">
          <div class="card">
            <h3>${t("attention")}</h3>
            ${alerts.length ? `<ul class="list">${alerts.join("")}</ul>` : `<p class="empty">${t("nothingAttention")}</p>`}
          </div>
          <div class="card">
            <h3>${t("monthlyChart")}</h3>
            <div class="chart-box"><canvas id="expenseChart" role="img" aria-label="${t("monthlyChart")}"></canvas></div>
          </div>
        </div>`;

      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("expenseChart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: t("expenses"),
            data: values,
            backgroundColor: (ctx) => {
              const { chart: c } = ctx;
              const g = c.ctx.createLinearGradient(0, 0, 0, c.height);
              g.addColorStop(0, "#E7BC5C");
              g.addColorStop(1, "#DB8A4A");
              return g;
            },
            borderRadius: 10,
            maxBarThickness: 48,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: "#8A7B68" } },
            y: { grid: { color: "#EEE5D5" }, ticks: { color: "#8A7B68" }, beginAtZero: true },
          },
        },
      });
    }

    function rowInfo(name, r) {
      if (name === "tasks") {
        return {
          title: r.title,
          meta: r.due_date ? `${t("f_due_date")}: ${r.due_date}` : "",
          right: statusBadge(r.status),
        };
      }
      if (name === "transactions") {
        return {
          title: r.category,
          meta: r.date,
          right: `<span class="amount ${r.type}">${r.type === "income" ? "+" : "-"} ${money(r.amount)}</span>`,
        };
      }
      return {
        title: r.name,
        meta: [r.client, r.due_date].filter(Boolean).join(" · "),
        right: statusBadge(r.status) + (r.amount ? ` <span class="amount">${money(r.amount)}</span>` : ""),
      };
    }

    function renderList(name) {
      const el = document.getElementById("view-" + name);
      const rows = cache[name];

      const body = rows.length
        ? `<ul class="list">${rows.map(r => {
            const i = rowInfo(name, r);
            return `
              <li>
                <div class="list-main">
                  <div class="row-title">${esc(i.title)}</div>
                  <div class="muted">${esc(i.meta)}</div>
                </div>
                <div class="row-side">
                  ${i.right}
                  <button class="btn-icon" data-action="edit" data-table="${name}" data-id="${r.id}" aria-label="${t("edit")}">${ICON_EDIT}</button>
                  <button class="btn-icon danger" data-action="delete" data-table="${name}" data-id="${r.id}" aria-label="${t("delete")}">${ICON_DEL}</button>
                </div>
              </li>`;
          }).join("")}</ul>`
        : `<p class="empty">${t("empty")}</p>`;

      el.innerHTML = `
        <div class="view-head">
          <h2>${t(TAB_KEY[name])}</h2>
          <button class="btn-primary" data-action="add" data-table="${name}">${t("add")}</button>
        </div>
        <div class="card">${body}</div>`;
    }

    // ===== Nono (assistant) =====
    function toggleNono(open) {
      const panel = document.getElementById("nonoPanel");
      const fab = document.getElementById("nonoFab");
      const willOpen = open ?? panel.hidden;
      panel.hidden = !willOpen;
      fab.classList.toggle("open", willOpen);
      fab.setAttribute("aria-expanded", String(willOpen));
      if (willOpen) {
        renderChat();
        document.getElementById("chatInput").focus();
      }
    }

    function renderChat() {
      const log = document.getElementById("chatLog");
      log.innerHTML = chatMessages.map(m => {
        const who = m.who === "you" ? t("chatYou") : t("chatBot");
        const text = m.key ? t(m.key) : m.text;
        const cls = `bubble ${m.who}${m.pending ? " pending" : ""}`;
        return `<div class="${cls}"><b>${who}</b><br>${esc(text)}</div>`;
      }).join("");
      log.scrollTop = log.scrollHeight;
    }

    async function sendToNono(e) {
      e.preventDefault();
      const input = document.getElementById("chatInput");
      const message = input.value.trim();
      if (!message) return;
      input.value = "";

      chatMessages.push({ who: "you", text: message });
      chatMessages.push({ who: "bot", key: "chatThinking", pending: true });
      renderChat();

      let reply;
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(ASSISTANT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${session.access_token}`,
            "apikey": SUPABASE_KEY,
          },
          body: JSON.stringify({ message }),
        });
        const json = await res.json();
        reply = json.reply || json.error || "No response";
      } catch (err) {
        reply = String(err);
      }

      chatMessages.pop(); // remove the "thinking" placeholder
      chatMessages.push({ who: "bot", text: reply });
      renderChat();
    }

    // ===== Modal (add / edit) =====
    function openModal(table, id = null) {
      const row = id ? (cache[table].find(r => String(r.id) === String(id)) || {}) : {};
      editing = { table, id };

      document.getElementById("modalTitle").textContent = t(id ? "edit" : "add") + " · " + t(TAB_KEY[table]);
      document.getElementById("modalFields").innerHTML = SCHEMAS[table].fields.map(f => {
        const val = row[f.name] ?? "";
        const label = t("f_" + f.name);
        let input;
        if (f.type === "select") {
          input = `<select name="${f.name}">${f.options.map(o =>
            `<option value="${o}" ${o === val ? "selected" : ""}>${t(f.optionKey + o)}</option>`).join("")}</select>`;
        } else if (f.type === "number") {
          input = `<input name="${f.name}" type="number" inputmode="decimal" step="0.01" value="${esc(val)}"${f.required ? " required" : ""}>`;
        } else {
          input = `<input name="${f.name}" type="${f.type}" value="${esc(val)}"${f.required ? " required" : ""}>`;
        }
        return `<label>${label}${input}</label>`;
      }).join("");

      document.getElementById("modal").hidden = false;
      const first = document.querySelector("#modalFields input, #modalFields select");
      if (first) first.focus();
    }

    function closeModal() {
      document.getElementById("modal").hidden = true;
      editing = null;
    }

    document.getElementById("modalForm").addEventListener("submit", async e => {
      e.preventDefault();
      const { table, id } = editing;
      const payload = {};
      for (const f of SCHEMAS[table].fields) {
        const v = e.target.elements[f.name].value;
        payload[f.name] = v === "" ? null : (f.type === "number" ? Number(v) : v);
      }

      const req = id
        ? sb.from(table).update(payload).eq("id", id)
        : sb.from(table).insert({ ...payload, user_id: user.id });

      const { error } = await req;
      if (error) { alert(error.message); return; }
      closeModal();
      await refreshAll();
    });

    async function removeRow(table, id) {
      if (!confirm(t("confirmDelete"))) return;
      const { error } = await sb.from(table).delete().eq("id", id);
      if (error) { alert(error.message); return; }
      await refreshAll();
    }

    // ===== Login / Logout =====
    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById("loginError").textContent = t("loginFailed") + " (" + error.message + ")";
      }
    });

    async function logout() {
      await sb.auth.signOut();
    }

    async function showApp() {
      document.getElementById("loginPage").hidden = true;
      document.getElementById("app").hidden = false;
      document.getElementById("loginError").textContent = "";
      showTab(currentTab);
      await refreshAll();
    }

    function showLogin() {
      document.getElementById("app").hidden = true;
      document.getElementById("loginPage").hidden = false;
      document.getElementById("password").value = "";
      toggleNono(false);
    }

    // Fires on page load (restores session) and on sign in / sign out
    sb.auth.onAuthStateChange(async (_event, session) => {
      if (session) {
        user = session.user;
        await showApp();
      } else {
        user = null;
        showLogin();
      }
    });

    // ===== Global clicks =====
    document.addEventListener("click", e => {
      const el = e.target.closest("[data-action], [data-tab]");
      if (!el) return;

      if (el.dataset.tab) return showTab(el.dataset.tab);

      switch (el.dataset.action) {
        case "toggleLang":
          lang = lang === "ar" ? "en" : "ar";
          applyI18n();
          if (user) renderAll();
          else renderChat();
          break;
        case "logout": logout(); break;
        case "add": openModal(el.dataset.table); break;
        case "edit": openModal(el.dataset.table, el.dataset.id); break;
        case "delete": removeRow(el.dataset.table, el.dataset.id); break;
        case "closeModal": closeModal(); break;
      }
    });

    // Esc closes the modal or the Nono panel
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (!document.getElementById("modal").hidden) closeModal();
      else if (!document.getElementById("nonoPanel").hidden) toggleNono(false);
    });

    document.getElementById("nonoFab").addEventListener("click", () => toggleNono());
    document.getElementById("nonoClose").addEventListener("click", () => toggleNono(false));
    document.getElementById("chatForm").addEventListener("submit", sendToNono);

    // Restore the tab from the URL hash, if any
    const initialHash = location.hash.replace("#", "");
    if (TABS.includes(initialHash)) currentTab = initialHash;

    applyI18n();
  </script>
</body>
</html>
